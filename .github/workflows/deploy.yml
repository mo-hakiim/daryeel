name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Daily rebuild so the sitemap, product pages and structured data pick up products
  # added or changed in the admin dashboard. 00:00 UTC = 03:00 Hargeisa time (UTC+3).
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Check Supabase settings
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::warning::VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY are not set as repository secrets or variables. The site will use the bundled products and /admin will be disconnected."
          elif ! echo "$VITE_SUPABASE_URL" | grep -qE '^https://[a-z0-9-]+\.supabase\.co/?$'; then
            echo "::warning::VITE_SUPABASE_URL should be the Project URL, like https://abcd1234.supabase.co (it is currently something else, maybe a key). The site will use the bundled products."
          elif echo "$VITE_SUPABASE_ANON_KEY" | grep -qE '^sb_secret_|service_role'; then
            echo "::error::VITE_SUPABASE_ANON_KEY is a SECRET key. Use the publishable (anon) key and rotate the secret one in Supabase."
            exit 1
          else
            echo "Supabase settings found (URL: $VITE_SUPABASE_URL)."
          fi
      - run: bun run build
        env:
          # Project site URL. For a custom domain change this to "/".
          BASE_PATH: /
          # Public Supabase settings (Settings → Secrets and variables → Actions,
          # as repository secrets or repository variables).
          # Only the anon key — never the service_role key.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
