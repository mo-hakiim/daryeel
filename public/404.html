<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found | Daryeel Wellness</title>
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet" />
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; box-sizing: border-box; background: radial-gradient(circle at 75% 30%, oklch(0.95 0.07 118), oklch(0.992 0.006 120) 60%); color: oklch(0.24 0.045 148); font-family: "Plus Jakarta Sans", system-ui, sans-serif; text-align: center; }
      .card { max-width: 32rem; }
      img { width: 5rem; height: auto; margin-bottom: 2rem; }
      h1 { font-family: "Fraunces", Georgia, serif; font-weight: 500; font-size: 5rem; margin: 0; line-height: 1; color: oklch(0.49 0.15 138); }
      h2 { font-family: "Fraunces", Georgia, serif; font-weight: 500; font-size: 1.5rem; margin: 1rem 0 0.5rem; }
      p { margin: 0 0 0.25rem; color: oklch(0.47 0.035 145); line-height: 1.6; }
      .so { margin-top: 1rem; font-size: 0.95rem; }
      a.btn { display: inline-block; margin-top: 1.75rem; padding: 0.8rem 1.75rem; border-radius: 999px; background: oklch(0.49 0.15 138); color: oklch(0.99 0.01 120); text-decoration: none; font-weight: 600; }
      a.btn:hover { background: oklch(0.43 0.14 140); }
    </style>
  </head>
  <body>
    <div class="card">
      <img id="logo" src="/favicon.png" alt="" onerror="this.style.display='none'" />
      <h1>404</h1>
      <h2>This page wandered off the path.</h2>
      <p>The page you're looking for doesn't exist or has moved.</p>
      <p class="so" lang="so">Bogga aad raadinayso ma jiro ama meel kale ayaa loo raray.</p>
      <a class="btn" id="home" href="/">Back to home · Ku noqo bogga hore</a>
    </div>
    <script>
      // On github.io project sites the site lives under /<repo>/; on a custom domain it is at /.
      var base = location.hostname.slice(-10) === ".github.io" ? "/" + location.pathname.split("/")[1] + "/" : "/";
      document.getElementById("home").href = base;
      document.getElementById("logo").src = base + "favicon.png";
      var icon = document.createElement("link");
      icon.rel = "icon";
      icon.href = base + "favicon.png";
      document.head.appendChild(icon);
    </script>
  </body>
</html>
